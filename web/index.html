<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="ink" class="is-intro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MixMark</title>
<link rel="icon" href="assets/logo.png">

<!-- ==========================================================================
     样式
     顺序不能变：令牌 → 主题 → 基础 → 布局 → 组件 → 编辑器 → 预览
     后面的文件会用到前面的变量与重置规则。
     ========================================================================== -->
<link rel="stylesheet" href="vendor/katex/katex.min.css?v=82">
<link rel="stylesheet" href="css/tokens.css?v=82">
<link rel="stylesheet" href="css/theme.css?v=82">
<link rel="stylesheet" href="css/base.css?v=82">
<link rel="stylesheet" href="css/layout.css?v=82">
<link rel="stylesheet" href="css/components.css?v=82">
<link rel="stylesheet" href="css/editor.css?v=82">
<link rel="stylesheet" href="css/preview.css?v=82">
<link rel="stylesheet" href="css/home.css?v=82">
<link rel="stylesheet" href="css/ai.css?v=82">
</head>
<body>

<div class="app" id="app" data-mode="split">

  <!-- ==================== 顶栏 ==================== -->
  <header class="topbar">
    <button class="icon-btn is-active" id="btn-sidebar" type="button"
            data-i18n-title="cmdToggleSidebar" data-i18n-aria="cmdToggleSidebar">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
    </button>

    <!-- 品牌名：启动时显示「欢迎使用 MixMark」，随后收紧为「MixMark」。
         两个 span 并排 —— 等「欢迎使用」的宽度收到 0，「MixMark」就自然
         移到最左，而不是用 transform 假动一下：它真的走到了最终位置。
         它同时是「回到首页」的入口：悬停时名字换成「首页」，点一下就回去。 -->
    <button class="brand" id="brand" type="button"
            data-i18n-title="brandHomeTitle" data-i18n-aria="brandHomeTitle">
      <span class="brand__welcome" id="brand-welcome" data-i18n="brandWelcome"></span>
      <span class="brand__mark">
        <span class="brand__name" data-i18n="appName"></span>
        <span class="brand__home" data-i18n="brandHome"></span>
      </span>
    </button>

    <!-- 菜单栏（文件 / 编辑）：条目由命令注册表的数据生成，
         新增菜单项不用改这里 -->
    <nav class="menubar" id="menubar" role="menubar"></nav>

    <div class="doc-title">
      <span class="doc-title__text" id="doc-title"></span>
      <span class="doc-title__disk" id="disk-badge" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/></svg>
      </span>
      <span class="doc-title__dot" id="dirty-dot"></span>
    </div>

    <div class="topbar__spacer"></div>

    <div class="segmented" id="view-switch" role="group">
      <button type="button" data-mode="edit"    data-i18n="viewTabEdit"></button>
      <button type="button" data-mode="split"   data-i18n="viewTabSplit"></button>
      <button type="button" data-mode="preview" data-i18n="viewTabPreview"></button>
    </div>

    <button class="icon-btn" id="btn-palette" type="button"
            data-i18n-title="cmdPalette" data-i18n-aria="cmdPalette">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></svg>
    </button>

    <button class="icon-btn" id="btn-settings" type="button"
            data-i18n-title="cmdSettings" data-i18n-aria="cmdSettings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
    </button>
  </header>

  <!-- ==================== 主体 ==================== -->
  <div class="body">

    <!-- 侧栏：折叠时靠宽度过渡，内部固定宽度避免文字重排 -->
    <aside class="sidebar">
      <div class="sidebar__inner">
        <!-- 当前仓库：点一下弹出仓库列表。
             放在最上面 —— 它决定了下面这棵树是谁的 -->
        <button class="repo-switch" id="repo-switch" type="button" data-i18n-title="statusRepoTitle">
          <span class="repo-switch__text">
            <span class="repo-switch__name" id="repo-switch-name"></span>
            <span class="repo-switch__path" id="repo-switch-path"></span>
          </span>
          <svg class="repo-switch__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <!-- 浏览器式标签：选中项与下方内容区连成一体（接缝圆角由 CSS 伪元素做） -->
        <div class="sidebar__tabs" id="sidebar-tabs" role="tablist">
          <button type="button" role="tab" data-tab="docs" data-i18n="panelDocs"></button>
          <button type="button" role="tab" data-tab="outline" data-i18n="panelOutline"></button>
          <button type="button" role="tab" data-tab="search" data-i18n="panelSearch"></button>
        </div>

        <div class="sidebar__panel" id="panel-docs">
          <!-- 面板操作条。
               这里原本还有一个「文档」文字标题，但它与上方的标签重复，已移除。 -->
          <div class="panel-bar">
            <button class="icon-btn" id="btn-new-doc" type="button"
                    data-i18n-title="cmdNewDoc" data-i18n-aria="cmdNewDoc">
              <svg viewBox="0 0 24 24"><path d="M13.5 3H7a1.5 1.5 0 00-1.5 1.5v15A1.5 1.5 0 007 21h10a1.5 1.5 0 001.5-1.5V8L13.5 3z"/><path d="M13.5 3v5h5"/><path d="M9 17h6"/><path d="M12 14v6"/></svg>
            </button>
            <button class="icon-btn" id="btn-new-folder" type="button"
                    data-i18n-title="cmdNewFolder" data-i18n-aria="cmdNewFolder">
              <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6h3.2l1.7 2H19a1.5 1.5 0 011.5 1.5v7A1.5 1.5 0 0119 18H4.5A1.5 1.5 0 013 16.5v-9z"/><path d="M12 11.5v4"/><path d="M10 13.5h4"/></svg>
            </button>
            <span class="panel-bar__spacer"></span>
            <button class="icon-btn" id="btn-pick-folder" type="button" hidden
                    data-i18n-title="cmdPickFolder" data-i18n-aria="cmdPickFolder">
              <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6h3.2l1.7 2H19a1.5 1.5 0 011.5 1.5v7A1.5 1.5 0 0119 18H4.5A1.5 1.5 0 013 16.5v-9z"/><path d="M9 13l3-3 3 3"/></svg>
            </button>
          </div>
          <div class="panel-scroll">
            <ul class="tree" id="doc-tree"></ul>
          </div>
        </div>

        <div class="sidebar__panel" id="panel-outline">
          <div class="panel-scroll">
            <ul class="outline" id="outline-list"></ul>
          </div>
        </div>

        <div class="sidebar__panel" id="panel-search">
          <div class="panel-bar">
            <input class="panel-bar__input" id="search-input" type="search"
                   data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
          </div>
          <div class="panel-scroll">
            <ul class="search-results" id="search-results"></ul>
          </div>
        </div>

        <!-- AI 助手：占侧栏下半部分，可折叠成一条标题栏，高度可上下拖。
             能自己读写文档库（见 js/ui/ai-panel.js 里的工具定义） -->
        <section class="ai" id="panel-ai">
          <!-- 拖动条压在面板顶边上：按住往上拖 = 我要更多对话空间 -->
          <div class="ai__resizer" id="ai-resizer" role="separator" aria-orientation="horizontal"
               data-i18n-title="aiResize" data-i18n-aria="aiResize"></div>
          <div class="ai__bar">
            <span class="ai__title" data-i18n="aiTitle"></span>
            <button class="icon-btn" id="ai-clear" type="button"
                    data-i18n-title="aiClear" data-i18n-aria="aiClear">
              <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
            </button>
            <button class="icon-btn" id="ai-toggle" type="button" aria-expanded="true"
                    data-i18n-title="aiToggle" data-i18n-aria="aiToggle">
              <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
            </button>
          </div>

          <div class="ai__body">
            <div class="ai__log" id="ai-log"></div>

            <div class="ai-keyform" id="ai-keyform" hidden>
              <label class="ai-keyform__label" for="ai-key" data-i18n="aiKeyLabel"></label>
              <input class="ai-keyform__input" id="ai-key" type="password"
                     autocomplete="off" spellcheck="false" data-i18n-placeholder="aiKeyPlaceholder">
              <div class="ai-keyform__row">
                <span class="ai-keyform__hint" data-i18n="aiKeyHint"></span>
                <button class="ai-keyform__save" id="ai-key-save" type="button" data-i18n="aiSave"></button>
              </div>
            </div>

            <div class="ai__status" id="ai-status" hidden></div>

            <!-- 引用条：这里列的东西会跟着这次提问一起发给 AI。
                 贴在输入框正上方，是为了让「它能看到什么」始终一目了然 -->
            <div class="ai-refs" id="ai-refs" hidden></div>

            <!-- 刻意不用 <form>：表单提交会让页面导航 / 刷新，
                 而这里只需要「点发送」与「回车发送」两件事。
                 用 div + button[type=button] 从根上就没有提交这回事 -->
            <div class="ai__compose" id="ai-compose">
              <textarea class="ai__input" id="ai-input" rows="1"
                        data-i18n-placeholder="aiPlaceholder" spellcheck="false"></textarea>
              <button class="ai__send" id="ai-send" type="button" data-i18n="aiSend"></button>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <!-- 侧栏 ↔ 编辑区的分隔条，与编辑区 ↔ 预览区那条各管各的 -->
    <div class="splitter splitter--sidebar" id="sidebar-splitter"></div>

    <!-- 工作区 -->
    <main class="workspace" id="workspace">

      <section class="pane pane--edit">
        <!-- 工具栏由 MM.commands 的 toolbar 元数据自动生成 -->
        <div class="editor-toolbar" id="editor-toolbar"></div>
        <div id="editor-host"></div>
      </section>

      <!-- 编辑区 ↔ 预览区的分隔条。必须在 .workspace 内部：
           它靠 e.clientX - workspace.left 换算比例，
           站在容器外面就会按「鼠标在容器最左边」算成 20% -->
      <div class="splitter" id="splitter" title="拖动调整分栏，双击恢复五五开"></div>

      <section class="pane pane--preview">
        <div class="preview-scroll" id="preview-scroll">
          <article class="preview" id="preview" hidden></article>

          <div class="preview-empty" id="preview-empty">
            <div data-i18n="previewEmpty"></div>
            <div style="font-size:12.5px">
              <span id="preview-empty-hint"></span>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ==================== 状态栏 ==================== -->
  <footer class="statusbar">
    <span class="statusbar__item statusbar__item--clickable" id="status-save"></span>
    <span class="statusbar__item" id="status-stats"></span>
    <span class="statusbar__item" id="status-cursor"></span>
    <span class="statusbar__spacer"></span>
    <span class="statusbar__item statusbar__item--clickable" id="status-repo"></span>
    <span class="statusbar__item">Markdown</span>
  </footer>

  <!-- 首页：第一次启动落在这里。顶栏留着（品牌名就是返回入口），
       只把工作区与状态栏收起来 —— 见 css/home.css 的 .app.is-home 规则 -->
  <section class="home" id="home" hidden>
    <div class="home__brand">
      <img class="home__logo" src="assets/logo.png" alt="" />
      <h1 class="home__title">MixMark</h1>
      <p class="home__tagline" data-i18n="homeTagline"></p>
    </div>

    <div class="home__repos-block">
      <h2 class="home__section" data-i18n="homeReposTitle"></h2>

      <!-- 仓库卡片由 home.js 渲染：一张卡片显示名称 + 地址，当前的那个带标记 -->
      <div class="home__repos" id="home-repos"></div>

      <button class="home-card__btn is-primary" id="btn-add-repo" type="button"
              data-i18n="homeRepoAdd" hidden></button>
    </div>

    <p class="home__note" data-i18n="homeReposHint"></p>
    <p class="home__note" data-i18n="homeNote"></p>
  </section>

</div>

<!-- 提示条容器 -->
<div class="toast-host" id="toast-host"></div>

<!-- ==========================================================================
     依赖：全部是本地 IIFE 经典脚本。
     不使用 CDN（要离线可用），不使用 type="module"（file:// 下会被 CORS 拒绝）。
     ========================================================================== -->
<script src="vendor/marked.js?v=82"></script>
<script src="vendor/purify.js?v=82"></script>
<script src="vendor/katex/katex.min.js?v=82"></script>
<script src="vendor/katex/mhchem.min.js?v=82"></script>
<script src="vendor/hljs.bundle.js?v=82"></script>
<script src="vendor/codemirror.bundle.js?v=82"></script>

<!-- ==========================================================================
     业务代码：加载顺序即依赖顺序，不可随意调换。
     ========================================================================== -->
<!-- 1. 基础设施 -->
<script src="js/i18n.js?v=82"></script>
<script src="js/core/store.js?v=82"></script>
<script src="js/core/settings.js?v=82"></script>
<!-- 仓库注册表：文档层要按仓库取工作台状态，必须排在 docs.js 之前 -->
<script src="js/core/repos.js?v=82"></script>
<script src="js/core/commands.js?v=82"></script>

<!-- 2. 存储层（顺序要紧：先有 library 工厂，各后端才能建出 provider；
     最后才是选路模块，它要读前面注册好的那几个） -->
<script src="js/provider/library.js?v=82"></script>
  <script src="js/provider/localstore.js?v=82"></script>
  <script src="js/provider/idb.js?v=82"></script>
  <script src="js/provider/fsa.js?v=82"></script>
  <script src="js/provider/diskfile.js?v=82"></script>
  <!-- 桌面端后端必须在 index.js 之前：选路时它要已在 MM.providers 里 -->
  <script src="js/provider/electron.js?v=82"></script>
  <script src="js/provider/index.js?v=82"></script>

<!-- 3. 文档 -->
<script src="js/core/docs.js?v=82"></script>
<script src="js/core/recovery.js?v=82"></script>
<script src="js/core/search.js?v=82"></script>

<!-- 4. 编辑器层 -->
<script src="js/editor/md-syntax.js?v=82"></script>
<script src="js/editor/math-symbols.js?v=82"></script>
<script src="js/editor/text-symbols.js?v=82"></script>
<script src="js/editor/cm-setup.js?v=82"></script>
<script src="js/editor/math-complete.js?v=82"></script>
<script src="js/editor/actions.js?v=82"></script>

<!-- 5. 预览层 -->
<script src="js/preview/pipeline.js?v=82"></script>
<script src="js/preview/line-map.js?v=82"></script>
<script src="js/preview/scroll-sync.js?v=82"></script>

<!-- 6. UI 层 -->
<script src="js/ui/toast.js?v=82"></script>
<script src="js/ui/dialogs.js?v=82"></script>
<script src="js/ui/palette.js?v=82"></script>
<script src="js/ui/menubar.js?v=82"></script>
<script src="js/ui/find-bar.js?v=82"></script>
<script src="js/ui/tabs.js?v=82"></script>
<script src="js/ui/repo-menu.js?v=82"></script>
<script src="js/ui/drop-assets.js?v=82"></script>
<script src="js/ui/symbol-panel.js?v=82"></script>
<script src="js/ui/outline.js?v=82"></script>
<script src="js/ui/sidebar.js?v=82"></script>
<script src="js/ui/statusbar.js?v=82"></script>
<script src="js/ui/settings-page.js?v=82"></script>
<script src="js/ui/app-commands.js?v=82"></script>
<script src="js/ui/home.js?v=82"></script>
<script src="js/ui/ai-panel.js?v=82"></script>
  <!-- 桌面端胶水层：浏览器里整个空转（靠 window.mixmark 自判），可以无条件引入 -->
  <script src="js/ui/desktop.js?v=82"></script>
  <script src="js/ui/shell.js?v=82"></script>

<!-- 7. 导出 -->
<script src="js/export/md.js?v=82"></script>
<script src="js/export/migrate.js?v=82"></script>
<script src="js/export/html.js?v=82"></script>
<script src="js/export/pdf.js?v=82"></script>

<!-- 8. 启动（必须最后） -->
<script src="js/main.js?v=82"></script>

</body>
</html>
